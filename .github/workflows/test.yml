name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baileys-unit-tests:
    name: Baileys WhatsApp Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
